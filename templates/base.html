<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ElderCare Guardian{% endblock %}</title>

  <!-- Bootstrap (grid + base utilities) — vendored locally so the app works on
       restricted/offline networks (e.g. care facilities) with no CDN access -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts: Fraunces (warm serif, for headings) + Inter (legible UI/data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">ElderCare <em>Guardian</em></span>
      </a>
      <nav class="topnav">
        <a href="{{ url_for('dashboard') }}">Monitor</a>
        <a href="{{ url_for('patient_page') }}">Patient</a>
      </nav>
    </div>
  </header>

  <main class="container-xl page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    ElderCare Guardian prototype. For demonstration and education only —
    not a medical device and not a substitute for emergency services.
  </footer>

  <!-- Chart.js — vendored locally (see note above) -->
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
